<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#20506e">
<title>Көлік жарысы</title>
<style>
:root{--paper:#f1eee6;--card:#fbf9f3;--ink:#1d2430;--muted:#6a6658;--line:#d8d0bd;--blue:#20506e;--blue-d:#173c54;--yellow:#e0a92e;--red:#b8442f;--green:#2e7d4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 "Segoe UI","Noto Sans",Roboto,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--blue);color:#fff;font-weight:600}
.top .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sc{font:800 19px Georgia,serif;background:rgba(255,255,255,.16);padding:1px 10px;border-radius:14px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#e0a92e;flex:none}.dot.on{background:#7fe08f}.dot.off{background:#e8604c}
.wrap{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
h1{font:700 24px/1.2 Georgia,serif;margin:6px 0 10px}
.big{display:block;width:100%;font:700 19px "Segoe UI",sans-serif;padding:14px;border-radius:10px;border:none;background:var(--blue);color:#fff}
.big:active{background:var(--blue-d)}
input.t{width:100%;font:600 20px "Segoe UI",sans-serif;padding:12px;border:2px solid var(--line);border-radius:9px;background:#fff;margin-bottom:10px}
.center{text-align:center}.mut{color:var(--muted);font-size:14px}
.opts{display:grid;gap:9px}
.o{display:flex;align-items:center;gap:10px;width:100%;min-height:68px;text-align:left;font:700 18px/1.2 "Segoe UI",sans-serif;padding:10px 12px;border:none;border-radius:11px;color:#fff;touch-action:manipulation}
.o b{font-size:24px;flex:none;width:28px;text-align:center}
.o0{background:#d63a35}.o1{background:#1f6fc4}.o2{background:#d09a12}.o3{background:#2a8f4d}
.o.dim{opacity:.3}.o.sel{outline:4px solid #1d2430;outline-offset:1px}
.tm{height:12px;background:#e4dcc9;border-radius:6px;overflow:hidden;margin:8px 0}.tm i{display:block;height:100%;background:var(--red)}
.q{font:700 21px/1.3 "Segoe UI",sans-serif;margin:6px 0 8px}
.res{font:800 34px Georgia,serif;margin:8px 0}
.trk{position:relative;height:58px;background:#4a4e54;border-radius:9px;margin:10px 0;overflow:hidden;border-bottom:5px solid #7fb069;border-top:5px solid #7fb069}
.trk::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 18px,transparent 18px 34px)}
.trk::after{content:"";position:absolute;right:0;top:0;bottom:0;width:18px;background:repeating-conic-gradient(#111 0 25%,#f6f6f6 0 50%) 0 0/12px 12px}
.trk svg{position:absolute;top:6px;width:68px;height:36px;transition:left 1.5s cubic-bezier(.2,.7,.3,1)}
.cc{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:5px}
</style>
</head>
<body>
<div class="top" id="top" hidden><span class="dot" id="dot"></span><span class="nm" id="tNm"></span><span class="sc" id="tSc">0</span></div>
<div class="wrap" id="app"></div>

<script src="mqtt.min.js"></script>
<script src="net.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id), app=$('app');
const qs=new URLSearchParams(location.search), ROOM=(qs.get('r')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const TAG=qs.get('u')||'';   // бір құрылғыда бірнеше оқушыны сынау үшін
const ls={get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
let PID=ls.get('tm_pid_'+ROOM+TAG,null); if(!PID){ PID=Math.random().toString(36).slice(2,10); ls.set('tm_pid_'+ROOM+TAG,PID); }
let NAME=ls.get('tm_name'+TAG,'')||'';
let net=null, joined=false, RCS=null, kicked=false, lastSeen=0, view='', timer=0, pendA=null, lastPos=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=n=>{ try{ navigator.vibrate&&navigator.vibrate(n); }catch(e){} };
const SY=['▲','◆','●','■'];
const carSvg=c=>`<svg viewBox="-68 -40 136 60" style="left:calc(4px + (100% - 90px) * var(--p))"><path d="M-60 -12h120a8 8 0 0 1 0 0v20a8 8 0 0 1-8 8h-104a8 8 0 0 1-8-8z" fill="${c}"/><path d="M-34 -12Q-24 -36 4 -36Q26 -36 38 -12Z" fill="${c}"/><path d="M-24 -13Q-17 -30 1 -30V-13ZM6 -13V-30Q20 -29 29 -13Z" fill="#cfe6f4"/><circle cx="-34" cy="14" r="13" fill="#22262b"/><circle cx="36" cy="14" r="13" fill="#22262b"/><circle cx="-34" cy="14" r="5" fill="#c3c8ce"/><circle cx="36" cy="14" r="5" fill="#c3c8ce"/></svg>`;
function track(m,anim){ const p=m.pos||0; const from=anim?lastPos:p; const h=`<div class="trk" id="trk" style="--p:${from/100}">${carSvg(m.col||'#d63a35')}</div>`; lastPos=p; if(anim) requestAnimationFrame(()=>requestAnimationFrame(()=>{ const t=$('trk'); if(t) t.querySelector('svg').style.left=`calc(4px + (100% - 90px) * ${p/100})`; })); return h; }
function setTop(){ $('top').hidden=!joined&&!NAME; $('tNm').textContent=NAME; $('tSc').textContent=RCS&&RCS.me&&RCS.me.pts!=null?RCS.me.pts:0; }
function vName(){ view='name'; app.innerHTML=`<h1 style="margin-top:22px">🏎 Көлік жарысына қосылу</h1><div class="card"><p class="mut" style="margin-top:0">Атың мен тегіңді жаз. Ол мұғалімнің экранында шығады.</p><input class="t" id="nm" maxlength="24" autocomplete="off" placeholder="Мысалы: Аружан Серікова" value="${esc(NAME)}"><button class="big" id="go">Кіру</button></div>`;
  $('go').onclick=()=>{ const v=$('nm').value.trim().replace(/\s+/g,' '); if(v.length<2){ $('nm').focus(); return; } NAME=v; ls.set('tm_name'+TAG,v); ls.set('tm_inroom_'+ROOM+TAG,true); start(); }; $('nm').addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); }); }
function vConn(){ view='conn'; app.innerHTML=`<div class="center" style="padding-top:44px"><div style="font-size:54px">📡</div><h1>Қосылып жатырмын…</h1><p class="mut">Бір сәт күт. Ұзаққа созылса, телефоның мұғалім компьютерімен бір Wi-Fi-да ма, тексер.</p></div>`; }
function render(){ setTop(); if(kicked) return; if(!joined||!RCS){ if(view!=='conn') vConn(); return; } const r=RCS,m=r.me||{}; const sig=[r.ph,r.i,m.ans,r.ph==='rev'?m.pts:'',r.ph==='lobby'?m.lane:''].join('~'); if(sig===view) return; view=sig; clearInterval(timer);
  if(r.ph==='lobby'){ lastPos=0; app.innerHTML=`<div class="center" style="padding-top:26px"><div style="font-size:54px">🏁</div><h1>Сен қосылдың, ${esc(NAME.split(' ')[0])}!</h1>${track(m)}<p><span class="cc" style="background:${m.col}"></span>Сенің көлігің: <b>${m.lane}-жол</b></p><p class="mut">Атың экранда шықты. Мұғалім жарысты бастағанша күте тұр.</p></div>`; return; }
  if(r.ph==='cd'){ lastPos=0; app.innerHTML=`<div class="center" style="padding-top:60px"><div class="res">Дайындал!</div>${track(m)}<p class="mut">Сұрақ қазір шығады.</p></div>`; return; }
  if(r.ph==='q'){ const answered=m.ans!=null; app.innerHTML=`<div class="mut center">${r.i+1}-сұрақ / ${r.n} · ${m.lane}-жол</div><div class="tm"><i id="tmI"></i></div><div class="q">${esc(r.q)}</div><div class="opts">${r.o.map((x,j)=>`<button class="o o${j}${answered?(m.ans===j?' sel':' dim'):''}" data-j="${j}" ${answered?'disabled':''}><b>${SY[j]}</b><span>${esc(x)}</span></button>`).join('')}</div>${answered?'<p class="center" style="font-weight:700;margin-top:12px">Жауабың қабылданды. Күте тұр…</p>':''}`;
    const end=Date.now()+r.left, T=r.T*1000, tick=()=>{ const e=$('tmI'); if(e) e.style.width=Math.max(0,(end-Date.now())/T*100)+'%'; }; tick(); timer=setInterval(tick,120);
    app.querySelectorAll('.o').forEach(b=>b.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(pendA||m.ans!=null) return; pendA={i:r.i,k:+b.dataset.j}; buzz(30); [...b.parentNode.children].forEach(x=>{ x.disabled=true; x.classList.add(x===b?'sel':'dim'); }); net.send({t:'ans',i:r.i,k:pendA.k}); })); return; }
  if(r.ph==='rev'){ pendA=null; const ok=m.ok; app.innerHTML=`<div class="center" style="padding-top:12px"><div style="font-size:52px">${m.ans==null?'⏰':ok?'🎉':'😕'}</div><div class="res" style="color:${ok?'var(--green)':'var(--red)'}">${m.ans==null?'Уақыт бітті':ok?'+'+m.gain+' ұпай':'Қате'}</div>${track(m,true)}<p>Дұрыс жауап: <b>${esc(r.ca||'')}</b></p>${r.sol?`<p class="mut">${esc(r.sol)}</p>`:''}<div class="card"><b>${m.pts||0}</b> ұпай · <b>${m.place||'–'}</b>-орын / ${r.cnt}</div><p class="mut">Экранға қара. Мұғалім келесі сұрақты ашады.</p></div>`; return; }
  if(r.ph==='end'){ app.innerHTML=`<div class="center" style="padding-top:26px"><div style="font-size:64px">${m.place===1?'🏆':m.place<=3?'🏅':'👏'}</div><h1>Жарыс аяқталды!</h1><div class="res">${m.place||'–'}-орын</div>${track(m)}<div class="card"><b>${m.pts||0}</b> ұпай · дұрыс жауап: <b>${m.right||0}</b> / ${r.n}</div></div>`; return; } }
function onMsg(m){ if(m.pid&&m.pid!==PID) return; lastSeen=Date.now();
  if(m.t==='kicked'){ kicked=true; joined=false; view=''; app.innerHTML=`<div class="center card" style="margin-top:50px"><h1>Мұғалім тізімнен алып тастады</h1><button class="big" id="re">Қайта кіру</button></div>`; $('re').onclick=()=>{ kicked=false; net.send({t:'hello',name:NAME,force:true}); vConn(); }; return; }
  if(m.t==='st'){ joined=true; RCS=m.rc; if(pendA&&RCS&&(RCS.i!==pendA.i||(RCS.me&&RCS.me.ans!=null))) pendA=null; render(); } }
function start(){ $('top').hidden=false; setTop(); vConn(); if(net){ net.send({t:'hello',name:NAME}); return; }
  net=NET.openPad({room:ROOM,pid:PID,onMsg,onStatus:s=>{ const d=$('dot'); d.className='dot '+(s==='on'?'on':s==='off'?'off':''); if(s==='on') net&&net.send({t:'hello',name:NAME}); }});
  setTimeout(()=>net.send({t:'hello',name:NAME}),700);
  setInterval(()=>{ if(!net||!net.online) return; if(!joined) net.send({t:'hello',name:NAME}); else { const m={t:'ping',n:NAME}; if(pendA) m.a=pendA; net.send(m); } if(lastSeen&&Date.now()-lastSeen>14000&&!document.hidden){ lastSeen=Date.now(); net.next(); } },2500);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&net&&net.online) net.send({t:'ping',n:NAME}); }); }
if(!ROOM){ app.innerHTML='<div class="card center" style="margin-top:50px"><h1>Сілтеме толық емес</h1><p class="mut">Экрандағы QR-кодты қайта сканерле.</p></div>'; }
else if(NAME&&ls.get('tm_inroom_'+ROOM+TAG,false)) start();
else vName();
window.__ph={get RCS(){return RCS;},PID};
</script>
</body>
</html>
